[project]
name = "promirrorgolf"
version = "0.1.0"
description = "PyQt-based golf sim companion with dual camera capture and session tracking"
authors = [{name = "ProMirrorGolf", email = "dev@example.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "SQLAlchemy>=2.0.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

